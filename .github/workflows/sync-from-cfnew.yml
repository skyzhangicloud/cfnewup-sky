name: 从 cfnew 同步 _worker.js

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动检查一次

# 提交更新需要写权限
permissions:
  contents: write

# 同一时间只跑一个同步任务，避免并发推送互相冲突
concurrency:
  group: sync-from-cfnew
  cancel-in-progress: false

env:
  UPSTREAM_REPO: byJoey/cfnew
  UPSTREAM_BRANCH: main
  # 上游把可部署源码放在这个伪装文件名下。它和 Release 里 Pages.zip 解出的
  # _worker.js 是同一份内容（blob 62abe996272748f5edf63d38ec011f159184d8dd）。
  # 上游若改名，本工作流会明确报错并提示改这里。
  UPSTREAM_PATH: 明文源吗
  TARGET_FILE: _worker.js

jobs:
  sync-worker:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 对比上游文件与本地 _worker.js
        id: cmp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 调用 GitHub API：带 token（5000 次/小时），失败重试 3 次，显式校验状态码
          gh_api() {
            local url="$1" out="$2" code="000" attempt
            for attempt in 1 2 3; do
              if code="$(curl -sS -o "$out" -w '%{http_code}' \
                   -H "Authorization: Bearer ${GH_TOKEN}" \
                   -H "Accept: application/vnd.github+json" \
                   -H "X-GitHub-Api-Version: 2022-11-28" \
                   "$url")"; then
                :
              else
                code="000"
              fi
              if [ "$code" = "200" ]; then
                echo "$code"
                return 0
              fi
              echo "请求失败（HTTP ${code}，第 ${attempt}/3 次）: ${url}" >&2
              sleep 5
            done
            echo "$code"
          }

          ENC_PATH="$(jq -rn --arg v "$UPSTREAM_PATH" '$v|@uri')"
          META="$(mktemp)"

          CODE="$(gh_api "https://api.github.com/repos/${UPSTREAM_REPO}/contents/${ENC_PATH}?ref=${UPSTREAM_BRANCH}" "$META")"

          if [ "$CODE" != "200" ]; then
            echo "错误：读取上游 ${UPSTREAM_REPO}/${UPSTREAM_PATH} 失败（HTTP ${CODE}）"
            echo "响应内容："
            head -c 800 "$META" || true
            echo
            echo "若为 404，说明上游改名或调整了目录结构。请到"
            echo "  https://github.com/${UPSTREAM_REPO}"
            echo "根目录确认当前可部署源码的文件名，然后修改本工作流顶部的 UPSTREAM_PATH。"
            exit 1
          fi

          UPSTREAM_BLOB="$(jq -r '.sha // empty' "$META")"
          UPSTREAM_SIZE="$(jq -r '.size // empty' "$META")"

          # 本地内容的 git blob 哈希：与上游 blob 同一套算法，内容相同则哈希相同
          LOCAL_BLOB=""
          if [ -f "$TARGET_FILE" ]; then
            LOCAL_BLOB="$(git hash-object "$TARGET_FILE")"
          fi

          echo "上游 ${UPSTREAM_PATH} : blob=${UPSTREAM_BLOB} size=${UPSTREAM_SIZE}"
          echo "本地 ${TARGET_FILE}     : blob=${LOCAL_BLOB:-（文件不存在）}"

          {
            echo "upstream_blob=${UPSTREAM_BLOB}"
            echo "upstream_size=${UPSTREAM_SIZE}"
            echo "local_blob=${LOCAL_BLOB}"
            echo "enc_path=${ENC_PATH}"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$LOCAL_BLOB" ] && [ "$UPSTREAM_BLOB" = "$LOCAL_BLOB" ]; then
            echo "内容一致（blob 相同），无需更新"
            echo "need_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "检测到上游内容变化，需要更新"
            echo "need_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载并更新 _worker.js
        if: steps.cmp.outputs.need_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENC_PATH: ${{ steps.cmp.outputs.enc_path }}
          EXPECTED_BLOB: ${{ steps.cmp.outputs.upstream_blob }}
        run: |
          set -euo pipefail

          RAW_URL="https://raw.githubusercontent.com/${UPSTREAM_REPO}/${UPSTREAM_BRANCH}/${ENC_PATH}"
          echo "下载: ${RAW_URL}"
          curl -sSL --retry 3 --retry-delay 5 -f -o "$TARGET_FILE" "$RAW_URL"

          # 下载后立刻校验：算出来的 blob 必须与上游一致，否则不提交
          ACTUAL_BLOB="$(git hash-object "$TARGET_FILE")"
          echo "下载后 blob : ${ACTUAL_BLOB}"
          echo "上游   blob : ${EXPECTED_BLOB}"
          if [ "$ACTUAL_BLOB" != "$EXPECTED_BLOB" ]; then
            echo "错误：下载内容与上游 blob 不一致，已中止（不会提交）"
            exit 1
          fi
          echo "校验通过：内容与上游完全一致"

          # 取上游最近一次改动该文件的提交，写进版本记录与提交信息
          CMT="$(mktemp)"
          curl -sS -o "$CMT" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/commits?path=${ENC_PATH}&per_page=1" || true

          C_SHA="$(jq -r '.[0].sha // empty' "$CMT" 2>/dev/null || true)"
          C_DATE="$(jq -r '.[0].commit.committer.date // empty' "$CMT" 2>/dev/null || true)"
          C_SUBJ="$(jq -r '(.[0].commit.message // "") | split("\n")[0]' "$CMT" 2>/dev/null || true)"
          SHORT="${C_SHA:0:7}"

          printf '%s@%s\n' "$UPSTREAM_BRANCH" "${SHORT:-unknown}" > VERSION.txt
          echo "VERSION.txt -> $(cat VERSION.txt)"

          # 提交信息写到 RUNNER_TEMP，避免被 git add -A 带进仓库
          MSGFILE="${RUNNER_TEMP}/commit-msg.txt"
          {
            printf '自动同步: 更新 _worker.js 到 %s@%s\n\n' "$UPSTREAM_REPO" "${SHORT:-unknown}"
            printf '上游文件 : %s\n' "$UPSTREAM_PATH"
            printf '上游提交 : %s\n' "${C_SHA:-(未取到)}"
            printf '提交时间 : %s\n' "${C_DATE:-(未取到)}"
            printf '提交说明 : %s\n' "${C_SUBJ:-(未取到)}"
            printf 'blob     : %s\n' "$ACTUAL_BLOB"
          } > "$MSGFILE"
          echo "提交信息："
          cat "$MSGFILE"

      - name: 提交并推送更改
        if: steps.cmp.outputs.need_update == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add -A

          if git diff --staged --quiet; then
            echo "没有变更需要提交"
          else
            git commit -F "${RUNNER_TEMP}/commit-msg.txt"
            git push
            echo "已提交并推送更新"
          fi

      - name: 输出摘要
        if: always()
        run: |
          {
            echo "## cfnew 同步结果"
            echo "- 上游: \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}/${UPSTREAM_PATH}\`"
            echo "- 上游 blob: \`${{ steps.cmp.outputs.upstream_blob }}\`"
            echo "- 本地 blob: \`${{ steps.cmp.outputs.local_blob }}\`"
          } >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.cmp.outputs.need_update }}" = "true" ]; then
            echo "- 状态: ✅ 已更新 \`_worker.js\`（跟随上游 commit）" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.cmp.outputs.need_update }}" = "false" ]; then
            echo "- 状态: ⏭️ 内容一致，无需更新" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 状态: ❌ 比对未完成，请查看上方日志" >> $GITHUB_STEP_SUMMARY
          fi
