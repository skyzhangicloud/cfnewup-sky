name: 从 cfnew 同步 Releases

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动检查一次

# 提交更新需要写权限
permissions:
  contents: write

# 同一时间只跑一个同步任务，避免并发推送互相冲突
concurrency:
  group: sync-from-cfnew
  cancel-in-progress: false

jobs:
  sync-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 获取 cfnew 最新发布
        id: get_latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          API_URL="https://api.github.com/repos/byJoey/cfnew/releases/latest"
          BODY="$(mktemp)"
          CODE="000"

          # 修复记录：旧版此处使用「未认证 curl + sed 取值」。api.github.com 未认证额度
          # 仅 60 次/小时且按出口 IP 共享，Runner 的 IP 被大量任务共用，一旦被限流就返回
          # 403 错误体 -> sed 取不到 assets_url -> curl "" -> 步骤以 exit code 3 直接挂掉。
          # 现在改为：带 GITHUB_TOKEN 调用（5000 次/小时）+ 3 次重试 + 显式 HTTP 状态码校验。
          for attempt in 1 2 3; do
            if CODE="$(curl -sS -o "$BODY" -w '%{http_code}' \
                 -H "Authorization: Bearer ${GH_TOKEN}" \
                 -H "Accept: application/vnd.github+json" \
                 -H "X-GitHub-Api-Version: 2022-11-28" \
                 "$API_URL")"; then
              :
            else
              CODE="000"
            fi

            if [ "$CODE" = "200" ]; then
              echo "已获取 cfnew 最新发布（第 ${attempt} 次尝试）"
              break
            fi

            echo "第 ${attempt} 次请求失败（HTTP ${CODE}），10 秒后重试..."
            sleep 10
          done

          if [ "$CODE" != "200" ]; then
            echo "错误：获取 byJoey/cfnew 最新发布失败（HTTP ${CODE}）"
            echo "响应内容："
            head -c 800 "$BODY" || true
            echo
            exit 1
          fi

          # 用 jq 解析（Runner 自带），避免 sed 在异常响应下静默产出空值
          VERSION="$(jq -r '.tag_name // empty' "$BODY")"
          DOWNLOAD_URL="$(jq -r '(.assets // []) | map(select((.name // "") | test("pages[._-]?zip$"; "i"))) | first | .browser_download_url // empty' "$BODY")"
          if [ -z "$DOWNLOAD_URL" ]; then
            # 兜底：按下载链接匹配
            DOWNLOAD_URL="$(jq -r '(.assets // []) | map(select((.browser_download_url // "") | test("pages[._-]?zip$"; "i"))) | first | .browser_download_url // empty' "$BODY")"
          fi
          FILE_NAME="Pages.zip"

          if [ -z "$VERSION" ]; then
            echo "错误：未能从响应中解析出版本号（tag_name）"
            exit 1
          fi

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "错误：最新 release（${VERSION}）中没有 Pages.zip 文件"
            echo "该 release 实际包含的资产："
            jq -r '(.assets // []) as $a | if ($a | length) > 0 then ($a[] | .name) else "(无)" end' "$BODY"
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "download_url=${DOWNLOAD_URL}"
            echo "file_name=${FILE_NAME}"
          } >> "$GITHUB_OUTPUT"

          echo "最新版本: ${VERSION}"
          echo "下载 URL: ${DOWNLOAD_URL}"
          echo "文件名: ${FILE_NAME}"

      - name: 检查当前版本
        id: check_version
        run: |
          # 读取当前记录的版本，如果文件不存在则创建空文件
          if [ ! -f "VERSION.txt" ]; then
            echo "未找到版本记录文件，创建新文件"
            touch VERSION.txt
            CURRENT_VERSION=""
          else
            CURRENT_VERSION=$(cat VERSION.txt | tr -d '\n\r ')
            if [ -z "$CURRENT_VERSION" ]; then
              echo "版本记录文件为空，将进行首次更新"
            else
              echo "当前记录的版本: $CURRENT_VERSION"
            fi
          fi

          NEW_VERSION="${{ steps.get_latest.outputs.version }}"
          echo "latest_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # 如果版本文件不存在或为空，或者版本不同，则需要更新
          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            if [ -z "$CURRENT_VERSION" ]; then
              echo "首次运行，将下载文件并创建版本记录"
            else
              echo "发现新版本 $CURRENT_VERSION -> $NEW_VERSION，需要更新"
            fi
            echo "need_update=true" >> $GITHUB_OUTPUT
          else
            echo "版本相同，无需更新"
            echo "need_update=false" >> $GITHUB_OUTPUT
          fi

      - name: 下载并更新文件
        if: steps.check_version.outputs.need_update == 'true'
        env:
          DOWNLOAD_URL: ${{ steps.get_latest.outputs.download_url }}
          FILE_NAME: ${{ steps.get_latest.outputs.file_name }}
          VERSION: ${{ steps.get_latest.outputs.version }}
        run: |
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "错误：未找到可下载的文件"
            exit 1
          fi

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "错误：未获取到版本号"
            exit 1
          fi

          echo "正在下载文件: $FILE_NAME"
          curl -L --retry 3 --retry-delay 5 -f -o "$FILE_NAME" "$DOWNLOAD_URL"

          if [ ! -f "$FILE_NAME" ]; then
            echo "错误：下载失败"
            exit 1
          fi

          echo "下载成功: $FILE_NAME"

          # 解压缩 Pages.zip
          echo "正在解压缩 $FILE_NAME..."
          if ! unzip -o "$FILE_NAME" -d .; then
            echo "错误：解压缩失败"
            exit 1
          fi

          echo "解压缩成功"

          # 删除 zip 文件（可选，如果不需要保留）
          rm -f "$FILE_NAME"
          echo "已删除压缩文件: $FILE_NAME"

          # 确保创建或更新版本记录文件
          if [ ! -f "VERSION.txt" ]; then
            echo "创建版本记录文件"
            touch VERSION.txt
          fi

          # 写入版本号
          echo "$VERSION" > VERSION.txt
          echo "版本记录已创建/更新: $VERSION"

          # 验证文件是否成功写入
          if [ -f "VERSION.txt" ] && [ -s "VERSION.txt" ]; then
            echo "✓ 版本记录文件创建成功"
          else
            echo "✗ 警告：版本记录文件可能未正确创建"
          fi

      - name: 提交并推送更改
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add -A

          if git diff --staged --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "自动同步: 更新到 cfnew ${{ steps.get_latest.outputs.version }}"
            git push
            echo "已提交并推送更新"
          fi

      - name: 输出摘要
        run: |
          {
            echo "## 同步结果"
            echo "- 最新版本: ${{ steps.get_latest.outputs.version }}"
            echo "- 当前版本: ${{ steps.check_version.outputs.current_version }}"
          } >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check_version.outputs.need_update }}" = "true" ]; then
            echo "- 状态: ✅ 已更新到新版本" >> $GITHUB_STEP_SUMMARY
            echo "- 下载文件: ${{ steps.get_latest.outputs.file_name }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 状态: ⏭️ 版本相同，无需更新" >> $GITHUB_STEP_SUMMARY
          fi
